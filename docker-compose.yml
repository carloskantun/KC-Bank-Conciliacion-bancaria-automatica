services:
  postgres:
    image: postgres:16-alpine
    container_name: kc-bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kcbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kcbank}
      POSTGRES_DB: ${POSTGRES_DB:-kcbank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kc-bank-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kcbank}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kc-bank-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kc-bank-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kc-bank-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kcbank}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kcbank123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kc-bank-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kc-bank-postgres-data:
  kc-bank-redis-data:
  kc-bank-minio-data:
